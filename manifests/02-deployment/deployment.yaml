apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
      - name: app
        image: ghcr.io/aoi1/handson-app:v1
        ports:
        - containerPort: 8080
        env:
        # 自分のPod名を環境変数で受け取る（Downward API）
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
